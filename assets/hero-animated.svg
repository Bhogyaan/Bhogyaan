<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">N R Bhogyaan — Frontend Engineer</title>
  <desc id="desc">A playful, modern animated hero in midnight violet with coral, lime, and lavender accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171326"/>
      <stop offset="0.55" stop-color="#211735"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A90"/>
      <stop offset="0.52" stop-color="#FFC36A"/>
      <stop offset="1" stop-color="#B7F36B"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".23"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D8CCFF" opacity=".17"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <ellipse cx="920" cy="145" rx="310" ry="220" fill="url(#wash)"/>

  <!-- Floating design accents -->
  <g fill="none" stroke-width="1.5" opacity=".8">
    <circle cx="1000" cy="155" r="94" stroke="#B7F36B" stroke-opacity=".35" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 155" to="360 1000 155" dur="42s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="155" r="126" stroke="#FF7A90" stroke-opacity=".22" stroke-dasharray="2 13">
      <animateTransform attributeName="transform" type="rotate" from="360 1000 155" to="0 1000 155" dur="55s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="1081" cy="93" r="6" fill="#FF7A90" filter="url(#softGlow)">
    <animate attributeName="cy" values="93;108;93" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="913" cy="225" r="5" fill="#B7F36B">
    <animate attributeName="cy" values="225;211;225" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <path d="M1090 203l9 9-9 9-9-9z" fill="#FFC36A">
    <animateTransform attributeName="transform" type="rotate" values="0 1090 212;90 1090 212;0 1090 212" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Tiny interface window -->
  <g transform="translate(865 105) rotate(7 115 70)" opacity=".87">
    <rect width="225" height="142" rx="13" fill="#171326" stroke="#BDAAFF" stroke-opacity=".55"/>
    <path d="M0 34h225" stroke="#BDAAFF" stroke-opacity=".25"/>
    <circle cx="17" cy="17" r="4" fill="#FF7A90"/>
    <circle cx="31" cy="17" r="4" fill="#FFC36A"/>
    <circle cx="45" cy="17" r="4" fill="#B7F36B"/>
    <rect x="18" y="52" width="68" height="7" rx="3.5" fill="#BDAAFF" opacity=".75"/>
    <rect x="18" y="68" width="130" height="5" rx="2.5" fill="#D9D2EA" opacity=".42"/>
    <rect x="18" y="82" width="105" height="5" rx="2.5" fill="#D9D2EA" opacity=".3"/>
    <rect x="18" y="104" width="70" height="21" rx="10" fill="url(#accent)"/>
    <path d="M177 66l8 8 15-18" fill="none" stroke="#B7F36B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="88" y="119" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#B7F36B">DESIGN-MINDED FRONTEND ENGINEER</text>
  <text x="84" y="183" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="54" font-weight="800" letter-spacing="-2" fill="#FFF9F2">N R BHOGYAAN</text>
  <text x="88" y="222" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" fill="#D7CFEA">Thoughtful interfaces. Smooth motion. Fast experiences.</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600">
    <rect x="88" y="250" width="91" height="30" rx="15" fill="#302541" stroke="#BDAAFF" stroke-opacity=".4"/>
    <text x="133.5" y="270" text-anchor="middle" fill="#D8CCFF">REACT</text>
    <rect x="190" y="250" width="124" height="30" rx="15" fill="#302541" stroke="#FF7A90" stroke-opacity=".45"/>
    <text x="252" y="270" text-anchor="middle" fill="#FF9EAD">MOTION</text>
    <rect x="325" y="250" width="83" height="30" rx="15" fill="#302541" stroke="#B7F36B" stroke-opacity=".45"/>
    <text x="366.5" y="270" text-anchor="middle" fill="#C9F798">3D WEB</text>
  </g>
  <rect x="0" y="312" width="1200" height="8" fill="url(#accent)" opacity=".9"/>
  <rect x="0" y="312" width="260" height="8" fill="#FFF9F2" opacity=".5">
    <animate attributeName="x" values="-260;1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
