<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#0f1420;#0D1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#0a0e14;#0D1117" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <!-- Cyber grid -->
  <g stroke="#58A6FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/><line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/><line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/><line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/><line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/><line x1="1000" y1="0" x2="1000" y2="280"/>
    <line x1="1100" y1="0" x2="1100" y2="280"/>
  </g>
  <!-- Floating particles -->
  <circle cx="150" cy="60" r="2" fill="#00F5D4"><animate attributeName="cy" values="60;220;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="180" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="180;40;180" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="90" r="2" fill="#7C3AED"><animate attributeName="cy" values="90;240;90" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="200" r="1.5" fill="#FFD166"><animate attributeName="cy" values="200;50;200" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.15;0.9" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="70" r="2" fill="#00F5D4"><animate attributeName="cy" values="70;210;70" dur="6.5s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="150" r="1.5" fill="#58A6FF"><animate attributeName="cy" values="150;30;150" dur="9s" repeatCount="indefinite"/></circle>
  <!-- Animated neon line -->
  <rect x="0" y="268" width="1200" height="2" fill="url(#neonLine)">
    <animate attributeName="x" values="-1200;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="600" y="115" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="48" font-weight="700" fill="#58A6FF" filter="url(#glow)">N R BHOGYAAN
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="155" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8B949E">Frontend Software Engineer  ·  React / Next.js / TypeScript / MERN</text>
  <rect x="420" y="175" width="360" height="3" rx="2" fill="url(#neonLine)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>
