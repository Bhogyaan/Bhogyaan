<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Engineering constellation</title>
  <desc id="desc">Five connected frontend engineering disciplines: product UI, application architecture, motion and 3D, APIs and state, and performance and delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#18142b"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5edce9"/><stop offset=".52" stop-color="#9083ff"/><stop offset="1" stop-color="#c99af1"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8072e8" stop-opacity=".2"/><stop offset="1" stop-color="#8072e8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="113" rx="530" ry="150" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="238" rx="17" fill="none" stroke="#a9b5ff" stroke-opacity=".2"/>
  <g fill="none" stroke="url(#wire)" stroke-opacity=".48">
    <path d="M128 115H1072"/><path d="M128 115L360 115 600 115 840 115 1072 115" stroke-dasharray="3 7"/>
    <circle cx="128" cy="115" r="37"/><circle cx="360" cy="115" r="37"/><circle cx="600" cy="115" r="44"/><circle cx="840" cy="115" r="37"/><circle cx="1072" cy="115" r="37"/>
  </g>
  <g fill="#8ce8eb"><circle cx="128" cy="115" r="4"/><circle cx="360" cy="115" r="4"/><circle cx="600" cy="115" r="5"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle><circle cx="840" cy="115" r="4"/><circle cx="1072" cy="115" r="4"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle">
    <g fill="#f2f1ff" font-size="12" font-weight="700"><text x="128" y="105">PRODUCT</text><text x="128" y="122">UI</text><text x="360" y="105">APP</text><text x="360" y="122">ARCHITECTURE</text><text x="600" y="106">FRONTEND</text><text x="600" y="125" fill="#c8baff">ENGINEERING</text><text x="840" y="105">MOTION</text><text x="840" y="122">&amp; 3D</text><text x="1072" y="105">APIs</text><text x="1072" y="122">&amp; STATE</text></g>
    <g fill="#9faac8" font-size="10"><text x="128" y="174">RESPONSIVE · ACCESSIBLE</text><text x="360" y="174">REACT · NEXT · REDUX</text><text x="600" y="180">DESIGN SYSTEMS · INTERACTION</text><text x="840" y="174">GSAP · THREE.JS · LENIS</text><text x="1072" y="174">REST · WORKFLOWS</text></g>
    <text x="600" y="218" fill="#74819f" font-size="10" letter-spacing="1.2">PERFORMANCE · QUALITY · DELIVERY</text>
  </g>
</svg>
