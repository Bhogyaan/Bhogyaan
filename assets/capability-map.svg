<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Frontend engineering capability map</title>
  <desc id="desc">Four connected engineering disciplines: product UI, frontend architecture, motion and browser capabilities, and reliable shipping, with performance and quality beneath them.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#19162b"/></linearGradient><linearGradient id="wire" x1="0" x2="1"><stop stop-color="#5de0d0"/><stop offset=".53" stop-color="#8795ff"/><stop offset="1" stop-color="#d39bf0"/></linearGradient></defs>
  <rect width="1200" height="250" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="248" rx="17" fill="none" stroke="#aeb9ff" stroke-opacity=".2"/>
  <text x="38" y="34" fill="#90e5de" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">02 / ENGINEERING CAPABILITIES · FROM INTERFACE TO DELIVERY</text>
  <g stroke="url(#wire)" stroke-opacity=".5" fill="none"><path d="M143 116H1057"/><path d="M143 116V91M447 116V91M753 116V91M1057 116V91"/><circle cx="143" cy="116" r="34"/><circle cx="447" cy="116" r="34"/><circle cx="753" cy="116" r="34"/><circle cx="1057" cy="116" r="34"/></g>
  <g fill="#8ce6de"><circle cx="143" cy="116" r="4"/><circle cx="447" cy="116" r="4"/><circle cx="753" cy="116" r="4"/><circle cx="1057" cy="116" r="4"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle"><g fill="#f3f2ff" font-size="11" font-weight="700"><text x="143" y="109">PRODUCT</text><text x="143" y="125">UI</text><text x="447" y="109">APP</text><text x="447" y="125">SYSTEMS</text><text x="753" y="109">MOTION</text><text x="753" y="125">&amp; MEDIA</text><text x="1057" y="109">RELIABLE</text><text x="1057" y="125">DELIVERY</text></g><g fill="#a3aec9" font-size="9"><text x="143" y="171">RESPONSIVE · ACCESSIBLE</text><text x="447" y="171">REACT · NEXT · REDUX · REST</text><text x="753" y="171">GSAP · THREE.JS · WEBCODECS</text><text x="1057" y="171">GIT · CI/CD · PERF · SEO</text></g></g>
