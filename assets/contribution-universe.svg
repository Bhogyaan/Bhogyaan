<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Bhogyaan OS contribution universe</title>
  <desc id="desc">A conceptual map of frontend, 3D and motion, media, APIs, and delivery engineering, connected around product engineering. It does not represent contribution counts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18132d"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#50d9f4"/><stop offset=".5" stop-color="#8676ff"/><stop offset="1" stop-color="#bd8cff"/></linearGradient>
  </defs>
  <rect width="1200" height="180" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="178" rx="17" fill="none" stroke="#a9b5ff" stroke-opacity=".18"/>
  <g stroke="url(#wire)" stroke-opacity=".55" fill="none">
    <path d="M600 90H166M600 90H390M600 90H810M600 90H1034"/>
    <circle cx="600" cy="90" r="49" stroke-opacity=".8"/>
    <circle cx="166" cy="90" r="30"/><circle cx="390" cy="90" r="30"/><circle cx="810" cy="90" r="30"/><circle cx="1034" cy="90" r="30"/>
  </g>
  <g fill="#76e6f4">
    <circle cx="600" cy="90" r="5"><animate attributeName="opacity" values=".45;1;.45" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="166" cy="90" r="4"/><circle cx="390" cy="90" r="4"/><circle cx="810" cy="90" r="4"/><circle cx="1034" cy="90" r="4"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle">
    <text x="600" y="86" fill="#eef0ff" font-size="13" font-weight="700">PRODUCT</text><text x="600" y="104" fill="#aeb8d7" font-size="11">ENGINEERING</text>
    <text x="166" y="145" fill="#aeb8d7" font-size="12">FRONTEND</text>
    <text x="390" y="145" fill="#aeb8d7" font-size="12">3D / MOTION</text>
    <text x="810" y="145" fill="#aeb8d7" font-size="12">MEDIA</text>
    <text x="1034" y="145" fill="#aeb8d7" font-size="12">APIs / DELIVERY</text>
  </g>
</svg>
