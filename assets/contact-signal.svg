<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Open channel — contact Bhogyaan</title>
  <desc id="desc">A quiet orbital signal from Madurai, India, inviting visitors to explore a portfolio or connect through LinkedIn, email, and GitHub.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a121b"/><stop offset=".55" stop-color="#111a2b"/><stop offset="1" stop-color="#21182b"/></linearGradient><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#62e0d0"/><stop offset=".52" stop-color="#8294ff"/><stop offset="1" stop-color="#d59bee"/></linearGradient></defs>
  <rect width="1200" height="150" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="148" rx="19" fill="none" stroke="#b1b8ef" stroke-opacity=".2"/>
  <path d="M0 145H1200" stroke="url(#edge)" stroke-width="4"/>
  <circle cx="1034" cy="75" r="49" fill="none" stroke="url(#edge)" stroke-opacity=".34"/><circle cx="1034" cy="75" r="34" fill="none" stroke="url(#edge)" stroke-opacity=".4"/><circle cx="1034" cy="75" r="17" fill="#20213a" stroke="#c6a9f6" stroke-opacity=".7"/><circle cx="1069" cy="44" r="3" fill="#a6ece1"/><circle cx="1001" cy="101" r="2" fill="#d9b4f4"/>
  <text x="48" y="49" fill="#8fe5dc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">06 / OPEN CHANNEL</text>
  <text x="48" y="86" fill="#f0eff7" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="700">Have a thoughtful frontend problem?</text>
  <text x="48" y="115" fill="#aab4ca" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">I’d be glad to hear about it. Portfolio · LinkedIn · Email · GitHub</text>
  <text x="1150" y="125" text-anchor="end" fill="#8391aa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1">SIGNAL FROM MADURAI, IN</text>
