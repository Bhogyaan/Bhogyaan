<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">N R Bhogyaan — Frontend Engineer</title>
  <desc id="desc">A custom dark portfolio scene combining a browser window and terminal, introducing a product-focused frontend engineer working with React, Next.js, JavaScript and thoughtful interfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d17"/><stop offset=".58" stop-color="#12172a"/><stop offset="1" stop-color="#20152b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62e1d1"/><stop offset=".54" stop-color="#8494ff"/><stop offset="1" stop-color="#d49af0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7e75ef" stop-opacity=".25"/><stop offset="1" stop-color="#7e75ef" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d7dfff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/><rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#b9c3ff" stroke-opacity=".19"/>
