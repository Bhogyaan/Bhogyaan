    <text x="56" y="126" fill="#c9a6f4" font-size="12" font-weight="700" letter-spacing="2.5">I TURN PIXELS INTO PRODUCTS.</text>
    <text x="52" y="188" fill="#f5f4fb" font-size="45" font-weight="800" letter-spacing="-1.6">Frontend Engineer</text>
    <text x="56" y="225" fill="#c4c9dd" font-size="17">Product-minded interfaces, built to work everywhere.</text>
    <text x="56" y="260" fill="#9ba7c2" font-size="13">React · Next.js · JavaScript · UI systems · browser experiences</text>
  </g>
