<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">The frontend technology aquarium</title>
  <desc id="desc">A calm, dark aquarium where JavaScript, React, Next.js, Redux, GSAP, Three.js, REST APIs and GitHub Actions are represented as floating, connected organisms.</desc>
  <defs>
    <linearGradient id="water" x2="0.9" y2="1"><stop stop-color="#081820"/><stop offset=".56" stop-color="#0c2230"/><stop offset="1" stop-color="#161a30"/></linearGradient>
    <linearGradient id="reef" x1="0" x2="1"><stop stop-color="#63e6d0"/><stop offset=".52" stop-color="#7eabff"/><stop offset="1" stop-color="#d49af2"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#79d9dd" stop-opacity=".16"/><stop offset="1" stop-color="#79d9dd" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#water)"/><rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#8edfe3" stroke-opacity=".24"/>
  <ellipse cx="612" cy="201" rx="478" ry="240" fill="url(#lamp)"/>
  <g stroke="#8ddbe0" stroke-opacity=".1"><path d="M36 58H1164M36 95H1164M36 132H1164M36 169H1164M36 206H1164M36 243H1164M36 280H1164"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><text x="40" y="38" fill="#8ce4df" font-size="10" letter-spacing="2">01 / FIELD NOTES · TECHNOLOGY ECOSYSTEM</text><text x="1160" y="38" text-anchor="end" fill="#90a9bc" font-size="9">A LIVING TOOLKIT · NOT A BADGE COLLECTION</text></g>
  <g fill="none" stroke="url(#reef)" stroke-opacity=".3"><path d="M119 170C240 108 318 234 439 160S643 120 743 185 942 229 1084 142"/><path d="M141 235C281 177 365 123 492 197S702 257 839 163 1008 135 1095 213" stroke-dasharray="3 7"/></g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" text-anchor="middle" font-weight="700">
    <g><circle cx="166" cy="152" r="31" fill="#102a34" stroke="#61e2d4" stroke-opacity=".8"/><text x="166" y="156" fill="#b6f2e7" font-size="12">JS</text><text x="166" y="202" fill="#d0d5e7" font-size="9">JAVASCRIPT</text></g>
    <g><circle cx="328" cy="216" r="27" fill="#152a3a" stroke="#62dce8" stroke-opacity=".8"/><text x="328" y="220" fill="#b1f1f3" font-size="10">R</text><text x="328" y="261" fill="#d0d5e7" font-size="9">REACT</text></g>
    <g><circle cx="487" cy="144" r="29" fill="#1c203b" stroke="#9290ff" stroke-opacity=".8"/><text x="487" y="148" fill="#d0caff" font-size="10">N</text><text x="487" y="190" fill="#d0d5e7" font-size="9">NEXT.JS</text></g>
    <g><circle cx="639" cy="210" r="27" fill="#292038" stroke="#d09bf1" stroke-opacity=".8"/><text x="639" y="214" fill="#efcffb" font-size="9">RDX</text><text x="639" y="255" fill="#d0d5e7" font-size="9">REDUX</text></g>
    <g><circle cx="787" cy="147" r="26" fill="#28243a" stroke="#e7b767" stroke-opacity=".8"/><text x="787" y="151" fill="#f5dfae" font-size="10">GS</text><text x="787" y="191" fill="#d0d5e7" font-size="9">GSAP</text></g>
    <g><circle cx="934" cy="216" r="29" fill="#132d34" stroke="#78e0bd" stroke-opacity=".8"/><text x="934" y="220" fill="#c2f4df" font-size="9">3D</text><text x="934" y="261" fill="#d0d5e7" font-size="9">THREE.JS</text></g>
    <g><circle cx="1074" cy="146" r="27" fill="#1b263b" stroke="#84b7ff" stroke-opacity=".8"/><text x="1074" y="150" fill="#c4ddff" font-size="9">API</text><text x="1074" y="190" fill="#d0d5e7" font-size="9">REST · CI/CD</text></g>
  </g>
  <g fill="#7de2d2" opacity=".8"><circle cx="238" cy="100" r="2"><animate attributeName="cy" values="100;94;100" dur="5s" repeatCount="indefinite"/></circle><circle cx="575" cy="267" r="1.7"><animate attributeName="cy" values="267;260;267" dur="6s" repeatCount="indefinite"/></circle><circle cx="1002" cy="104" r="2"><animate attributeName="cy" values="104;98;104" dur="4.8s" repeatCount="indefinite"/></circle></g>
  <text x="600" y="304" text-anchor="middle" fill="#8296a9" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="1.3">PRODUCT UI · STATE · MOTION · APIS · DELIVERY</text>
</svg>
