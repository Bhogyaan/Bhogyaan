name: Generate GitHub Profile Assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    name: Generate Profile Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent"
          path: public/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=transparent"
          path: public/github-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/github-stats.svg public/github-top-langs.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes."
            exit 0
          fi

          git commit -m "chore: update GitHub profile assets"

          git pull --rebase origin main

          git push origin main
