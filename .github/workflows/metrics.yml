name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate metrics token
        shell: bash
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::error::METRICS_TOKEN is not configured. Create a classic PAT (not a fine-grained PAT) and store it as a repository secret named METRICS_TOKEN."
            exit 1
          fi
          echo "METRICS_TOKEN is configured. Note: lowlighter/metrics requires a classic PAT for user/profile metrics; fine-grained PATs are not supported by GitHub GraphQL for this workflow."

      - name: Update metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bhogyaan
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_threshold: X
          plugin_habits: yes
          plugin_habits_from: 200
          output_action: commit
          committer_message: "chore: update metrics"
